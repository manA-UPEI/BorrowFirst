services:
  - type: web
    name: borrowfirst
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: '1'
      - key: SESSION_NAME
        value: borrowfirst.sid
      - key: SESSION_SECRET
        generateValue: true
      - key: TRANSACTION_CODE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: borrowfirst-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: borrowfirst-db
    plan: basic-256mb
