<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowFirst | Payment</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="page-payment">
  <div id="appShell"></div>

  <main class="content">
    <div class="page-head">
      <div>
        <h1>Payment</h1>
        <p class="subtitle">Reservation details that future payment support will use.</p>
      </div>
    </div>

    <section class="confirm-card">
      <div class="section-header">
        <div>
          <h2>Reservation Summary</h2>
          <p class="subtitle">The layout is ready for future gateway wiring. For now, it shows the rental context that would be billed.</p>
        </div>
      </div>
      <div class="confirm-single">
        <div class="summary-panel">
          <div id="paymentSummary" class="summary"></div>
        </div>
      </div>
      <button class="primary" id="backHome" type="button">Back to Home</button>
    </section>
  </main>

  <script type="module" src="/js/payment.js"></script>
</body>
</html>
