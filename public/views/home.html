<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowFirst | Home</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="page-home">
  <div id="appShell"></div>

  <main class="content">
    <div class="page-head">
      <div>
        <h1>Home</h1>
        <p class="subtitle">Browse what is available to borrow right now across campus.</p>
      </div>
      <div class="page-head-actions">
        <div class="stat-strip">
          <span class="stat-chip"><strong id="availableCount">0</strong><span>available</span></span>
          <span class="stat-chip"><strong id="myListingCount">0</strong><span>your listings</span></span>
          <span class="stat-chip"><strong id="pendingCount">0</strong><span>pending</span></span>
        </div>
      </div>
    </div>

    <section class="panel section-panel">
      <div class="section-header">
        <div>
          <h2>Available Products</h2>
          <p class="subtitle">Reserved and borrowed items are hidden from this catalog.</p>
        </div>
        <div class="field search-field">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="text" placeholder="Search by name, condition, or description" />
        </div>
      </div>

      <div class="filter-bar">
        <div class="chip-row" id="productFilters">
          <button class="chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="budget" aria-pressed="false">Under $10/day</button>
          <button class="chip" type="button" data-filter="excellent" aria-pressed="false">Excellent condition</button>
        </div>
        <span class="section-count" id="availableCountLabel">0 items</span>
      </div>

      <div id="productGrid" class="grid"></div>
      <p id="productMessage" class="error"></p>
    </section>
  </main>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
